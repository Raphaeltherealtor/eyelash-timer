<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Eyelash Timer</title>

  <!-- PWA meta -->
  <meta name="theme-color" content="#89CFF0" />
  <meta name="description" content="Multiple countdown timers and AI translation" />
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Eyelash Timer" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1 id="header-title">Eyelash Timer</h1>
      <span id="timer-count">0 / 7</span>
    </header>

    <!-- ── Timer Tab ───────────────────────── -->
    <div id="tab-timer" class="tab-pane active">
      <div id="timer-list"></div>
      <div id="footer">
        <button id="btn-add">+ Add Timer</button>
      </div>
    </div>

    <!-- ── Translate Tab ──────────────────── -->
    <div id="tab-translate" class="tab-pane">

      <!-- API Key -->
      <div class="tr-section">
        <span class="tr-label">OpenAI API Key</span>

        <!-- Shown when no key is saved -->
        <div id="key-input-row" class="key-input-row" style="display:none">
          <input type="password" id="api-key-input" placeholder="Paste your API key…" autocomplete="off" spellcheck="false" />
          <button id="btn-save-key" class="btn-pill">Save</button>
        </div>

        <!-- Shown once key is saved -->
        <div id="key-saved-row" class="key-saved-row" style="display:none">
          <span class="key-saved-label">✓ API key saved</span>
          <button id="btn-change-key" class="btn-text">Change</button>
        </div>
      </div>

      <!-- Language selectors -->
      <div class="tr-section">
        <div class="lang-row">
          <div class="lang-col">
            <label class="tr-label" for="source-lang-select">Speaking in</label>
            <div class="select-wrap">
              <select id="source-lang-select">
                <option value="">Auto-detect</option>
                <option value="ar">Arabic</option>
                <option value="hy">Armenian</option>
                <option value="zh">Chinese (Simplified)</option>
                <option value="zh">Chinese (Traditional)</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="hi">Hindi</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="fa">Persian (Farsi)</option>
                <option value="pt">Portuguese</option>
                <option value="pa">Punjabi</option>
                <option value="ru">Russian</option>
                <option value="es">Spanish</option>
                <option value="tl">Tagalog</option>
                <option value="vi">Vietnamese</option>
              </select>
            </div>
          </div>
          <div class="lang-col">
            <label class="tr-label" for="lang-select">Translate to</label>
            <div class="select-wrap">
              <select id="lang-select">
                <option value="">— pick a language —</option>
                <option value="Arabic">Arabic</option>
                <option value="Armenian">Armenian</option>
                <option value="Chinese (Simplified)">Chinese (Simplified)</option>
                <option value="Chinese (Traditional / Taiwanese)">Chinese (Traditional / Taiwanese)</option>
                <option value="English">English</option>
                <option value="French">French</option>
                <option value="Hindi">Hindi</option>
                <option value="Japanese">Japanese</option>
                <option value="Korean">Korean</option>
                <option value="Persian">Persian (Farsi)</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Punjabi">Punjabi</option>
                <option value="Russian">Russian</option>
                <option value="Spanish">Spanish</option>
                <option value="Tagalog">Tagalog (Filipino)</option>
                <option value="Vietnamese">Vietnamese</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Mic -->
      <div class="tr-section mic-section">
        <button id="btn-mic" class="mic-btn" aria-label="Record">
          <span id="mic-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="2" width="6" height="11" rx="3" fill="#89CFF0"/>
              <path d="M5 10a7 7 0 0 0 14 0" stroke="#89CFF0" stroke-width="2" stroke-linecap="round"/>
              <line x1="12" y1="17" x2="12" y2="21" stroke="#89CFF0" stroke-width="2" stroke-linecap="round"/>
              <line x1="8" y1="21" x2="16" y2="21" stroke="#89CFF0" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
        </button>
        <div id="rec-status" class="rec-status">Tap to record</div>
      </div>

      <!-- Transcription -->
      <div class="tr-section result-section" id="transcription-section" style="display:none">
        <div class="result-header">
          <span class="tr-label">Transcription</span>
          <button id="btn-copy-transcript" class="btn-text">Copy</button>
        </div>
        <textarea id="transcription-text" class="result-text result-textarea" rows="3" placeholder="Transcription will appear here…"></textarea>
      </div>

      <!-- Translation -->
      <div class="tr-section result-section" id="translation-section" style="display:none">
        <div class="result-header">
          <span class="tr-label" id="translation-label">Translation</span>
          <button id="btn-copy-translation" class="btn-text">Copy</button>
        </div>
        <div id="translation-text" class="result-text"></div>
        <button id="btn-translate" class="btn-pill btn-translate-action" style="display:none">Translate</button>
      </div>

    </div><!-- /tab-translate -->

    <!-- ── Floating mic button ───────────────── -->
    <button id="fab-mic" aria-label="Quick translate">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="2" width="6" height="11" rx="3" fill="white"/>
        <path d="M5 10a7 7 0 0 0 14 0" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="17" x2="12" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="21" x2="16" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- ── Tab Bar ─────────────────────────── -->
    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="timer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <polyline points="12 7 12 12 15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Timer</span>
      </button>
      <button class="tab-btn" data-tab="translate">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M3 5h10M8 3v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M5 8c.5 2 2 4 4 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 8c-.5 2-2 4-4 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="m15 19 2-5 2 5M15.8 17h2.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="13" y="11" width="9" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Translate</span>
      </button>
    </nav>

  </div>

  <script src="/app.js"></script>
</body>
</html>
