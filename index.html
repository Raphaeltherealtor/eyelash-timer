<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Eyelash Timer</title>

  <!-- PWA meta -->
  <meta name="theme-color" content="#89CFF0" />
  <meta name="description" content="Multiple countdown timers — up to 7 at once" />
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Eyelash Timer" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Eyelash Timer</h1>
      <span id="timer-count">0 / 7</span>
    </header>

    <div id="timer-list"></div>

    <div id="footer">
      <button id="btn-add">+ Add Timer</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
